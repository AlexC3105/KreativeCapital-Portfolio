# KreativeCapital CI: educational project, local development chain only.
# No repository secrets, no .env files, no real wallets or public chains. All services the jobs
# start (Hardhat nodes, Vite preview, headless Chrome) bind to 127.0.0.1 and are stopped by the
# test harnesses; browser application traffic is restricted to loopback by the browser harness.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.5"
  NPM_VERSION: "10.9.9"
  HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
  npm_config_update_notifier: "false"
  npm_config_fund: "false"

jobs:
  policy:
    name: Repository policy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Policy scanner regression tests (synthetic fixtures only)
        run: node --test scripts/test/check-repo-policy.test.mjs
      - name: Prohibited files, credentials and personal paths
        run: node scripts/check-repo-policy.mjs

  test:
    name: Contracts, frontend, integration, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify exact toolchain versions
        run: |
          test "$(node -v)" = "v${NODE_VERSION}"
          test "$(npm -v)" = "${NPM_VERSION}"
      - name: Setup - install dependencies (lockfile, registry only, no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Setup - compile contracts (downloads pinned solc 0.8.24) and export artifacts
        run: npm run compile
      - name: Contract tests (smoke, unit, randomized invariants 20 seeds x 200 operations)
        run: npm run test -w contracts
      - name: Frontend unit and UI tests with coverage
        run: npm run test:coverage -w frontend
      - name: Local-chain integration tests (Hardhat node on 127.0.0.1:8546)
        run: npm run test:integration -w frontend
      - name: Production frontend build
        run: npm run build -w frontend

  browser:
    name: Browser validation and accessibility
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup - install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Setup - compile contracts (downloads pinned solc 0.8.24)
        run: npm run compile
      - name: Headless Chrome flows, insolvency, wallet picker, axe-core (loopback only)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          KC_CHROME_NO_SANDBOX: "1" # disposable runner only; Ubuntu 24.04 AppArmor may block the Chrome sandbox
          KC_E2E_OUT: ${{ runner.temp }}/kc-e2e
        run: npm run e2e:browser

  audit:
    name: Dependency advisory report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup - install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Runtime and full advisory report (informational)
        run: |
          npm audit --omit=dev || true
          npm audit || true
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
